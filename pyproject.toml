[project]
name = "memplug-capture"
version = "0.1.0"
description = "Local capture for Claude Code, Codex, and Cursor"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
memplug-capture = "memplug_capture.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
