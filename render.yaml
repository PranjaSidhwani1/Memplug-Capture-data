services:
  - type: web
    name: memplug-capture
    runtime: python
    rootDir: capture
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_DB
        value: memplug
      - key: MEMPLUG_CAPTURE_API_KEY
        sync: false
      - key: MEMPLUG_AUTH_SECRET
        sync: false
      - key: MEMPLUG_PUBLIC_API_URL
        sync: false
      - key: MONGODB_URI
        sync: false
