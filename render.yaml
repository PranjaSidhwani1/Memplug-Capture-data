services:
  - type: web
    name: memplug-capture
    runtime: python
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_DB
        value: memplug
      - key: MEMPLUG_CAPTURE_API_KEY
        sync: false
      - key: MEMPLUG_AUTH_SECRET
        sync: false
      - key: MEMPLUG_PUBLIC_API_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: META_API_KEY
        sync: false
      - key: META_MODEL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHECKPOINT_TOKENS
        value: "1000"
      - key: CHECKPOINT_IDLE_MINUTES
        value: "30"
